[package]
name = "ohos-ohcamera-sys"
version = "0.1.0"
edition = "2021"
description = "Raw bindings to the CameraKit ohcamera APIs of OpenHarmony"
license = "Apache-2.0"
repository = "https://github.com/openharmony-rs/ohos-sys"
keywords = ["OpenHarmony", "HarmonyOS", "ffi", "camera", "ohcamera"]
readme = "README.md"
include = ["/src", "/README.md"]

[dependencies]
document-features = { version = "0.2", optional = true }
ohos-sys-opaque-types = { workspace = true }

[features]
default = []

## No effect. API-10 has no ohcamera bindings. The feature exists for internal purposes.
api-10 = []
## Enables bindings for OpenHarmony API-level 11. This is the lowest API level
## at which ohcamera APIs are available.
api-11 = ["api-10"]
api-12 = ["api-11"]
api-13 = ["api-12"]
api-14 = ["api-13"]
api-15 = ["api-14"]
api-16 = ["api-15"]
api-17 = ["api-16"]
api-18 = ["api-17"]
api-19 = ["api-18"]
api-20 = ["api-19"]
api-21 = ["api-20"]
## Enables API-level 22 physical camera orientation and ISO change callback APIs.
api-22 = ["api-21"]
## Enables API-level 23 occlusion detection, metadata object type, bandwidth
## compression, full output capability, and rotation-without-device/display APIs.
api-23 = ["api-22"]
## Document available features when building the documentation.
document-features = ["dep:document-features"]

[package.metadata.docs.rs]
features = ["document-features"]
targets = ["aarch64-unknown-linux-ohos", "armv7-unknown-linux-ohos", "x86_64-unknown-linux-ohos"]
all-features = true
