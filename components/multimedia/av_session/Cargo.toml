[package]
name = "ohos-av-session-sys"
version = "0.1.0"
edition = "2021"
description = "Raw bindings to the AVSessionKit APIs of OpenHarmony"
license = "Apache-2.0"
repository = "https://github.com/openharmony-rs/ohos-sys"
keywords = ["OpenHarmony", "HarmonyOS", "ffi", "media", "session"]
readme = "README.md"

[dependencies]
document-features = { version = "0.2", optional = true }

[features]
default = []

#! ### OpenHarmony API level
#! The AVSessionKit NDK starts at API-level 13. Device, cast and playback-state
#! APIs are additionally gated by API-level 23 in the generated bindings.
#! Defaults to no bindings to maintain feature composability in `ohos-sys`.

## Enables bindings for OpenHarmony API-level 13.
api-13 = []
## Enables bindings for OpenHarmony API-level 14.
api-14 = ["api-13"]
## Enables bindings for OpenHarmony API-level 15.
api-15 = ["api-14"]
## Enables bindings for OpenHarmony API-level 16.
api-16 = ["api-15"]
## Enables bindings for OpenHarmony API-level 17.
api-17 = ["api-16"]
## Enables bindings for OpenHarmony API-level 18.
api-18 = ["api-17"]
## Enables bindings for OpenHarmony API-level 19.
api-19 = ["api-18"]
## Enables bindings for OpenHarmony API-level 20.
api-20 = ["api-19"]
## Enables bindings for OpenHarmony API-level 21.
api-21 = ["api-20"]
## Enables bindings for OpenHarmony API-level 22.
api-22 = ["api-21"]
## Enables bindings for OpenHarmony API-level 23.
api-23 = ["api-22"]
## Document available features when building the documentation.
document-features = ["dep:document-features"]

[package.metadata.docs.rs]
features = ["document-features"]
targets = ["aarch64-unknown-linux-ohos", "armv7-unknown-linux-ohos", "x86_64-unknown-linux-ohos"]
all-features = true
