[package]
name = "ohos-sys"
version = "0.9.0"
edition = "2021"
description = "Bindings to the native API of OpenHarmony OS"
license = "Apache-2.0"
repository = "https://github.com/openharmony-rs/ohos-sys"
keywords = ["OpenHarmony", "HarmonyOS", "ffi"]
readme = "Readme.md"
resolver = "2"
rust-version = "1.78.0"

[workspace]
members = [
    "components/*",
    "components/multimedia/drm_framework",
    "components/multimedia/av_session",
    "components/multimedia/image_effect",
    "components/multimedia/image_framework",
    "components/multimedia/media_library",
    "components/multimedia/player_framework",
    "components/multimedia/video_processing_engine",
]
exclude = ["components/multimedia", "scripts"]


[workspace.dependencies]
ohos-sys-opaque-types = { version = "0.1.10", path = "components/opaque-types" }

[dependencies]
document-features = { version = "0.2", optional = true }
arkui-sys = { version = "0.3.4", optional = true, path = "components/arkui" }
ohos-accesstoken-sys = { version = "0.1.1", optional = true, path = "components/accesstoken" }
ohos-asset-store-sys = { version = "0.1.1", optional = true, path = "components/asset" }
ohos-basic-services-kit-sys = { version = "0.1.0", optional = true, path = "components/basic-services-kit" }
ohos-crypto-sys = { version = "0.1.1", optional = true, path = "components/crypto" }
ohos-huks-sys = { version = "0.1.1", optional = true, path = "components/huks" }
hilog-sys = { version = "0.1.8", optional = true, path = "components/hilog" }
hitrace-sys = { version = "0.1.10", optional = true, path = "components/hitrace" }
ohos-abilitykit-sys = { version = "0.1.6", optional = true, path = "components/abilitykit" }
ohos-background-process-manager-sys = { version = "0.1.0", optional = true, path = "components/background_process_manager" }
ohos-deviceinfo-sys = { version = "0.1.7", optional = true, path = "components/deviceinfo" }
ohos-distributedhardware-sys = { version = "0.1.0", optional = true, path = "components/distributedhardware" }
ohos-ddk-sys = { version = "0.1.0", optional = true, path = "components/ddk" }
ohos-hid-sys = { version = "0.1.0", optional = true, path = "components/hid" }
ohos-native-color-space-manager-sys = { version = "0.1.0", optional = true, path = "components/native_color_space_manager" }
ohos-native-display-soloist-sys = { version = "0.1.0", optional = true, path = "components/native_display_soloist" }
ohos-native-effect-sys = { version = "0.1.0", optional = true, path = "components/native_effect" }
ohos-native-fence-sys = { version = "0.1.0", optional = true, path = "components/native_fence" }
ohos-purgeable-memory-sys = { version = "0.1.0", optional = true, path = "components/purgeable_memory" }
ohos-scsi-peripheral-sys = { version = "0.1.0", optional = true, path = "components/scsi_peripheral" }
ohos-transient-task-sys = { version = "0.1.0", optional = true, path = "components/transient_task" }
ohos-usb-serial-sys = { version = "0.1.0", optional = true, path = "components/usb_serial" }
ohos-gamecontrollerkit-sys = { version = "0.1.0", optional = true, path = "components/GameControllerKit" }
ohos-notificationkit-sys = { version = "0.1.0", optional = true, path = "components/NotificationKit" }
ohos-ark-runtime-sys = { version = "0.1.0", optional = true, path = "components/ark_runtime" }
ohos-bundle-sys = { version = "0.1.0", optional = true, path = "components/bundle" }
ohos-hiappevent-sys = { version = "0.1.0", optional = true, path = "components/hiappevent" }
ohos-drm-sys = { version = "0.1.0", optional = true, path = "components/multimedia/drm_framework" }
ohos-image-effect-sys = { version = "0.1.0", optional = true, path = "components/multimedia/image_effect" }
ohos-i18n-sys = { version = "0.1.0", optional = true, path = "components/i18n" }
ohos-mindspore-sys = { version = "0.1.0", optional = true, path = "components/mindspore" }
ohos-neural-network-runtime-sys = { version = "0.1.0", optional = true, path = "components/neural_network_runtime" }
ohos-usb-sys = { version = "0.1.0", optional = true, path = "components/usb" }
ohos-drawing-sys = { path = "components/drawing", version = "0.3.4", optional = true }
ohos-hidebug-sys = { version = "0.1.0", optional = true, path = "components/hidebug" }
ohos-hicollie-sys = { version = "0.1.0", optional = true, path = "components/hicollie" }
ohos-av-session-sys = { version = "0.1.0", optional = true, path = "components/multimedia/av_session" }
ohos-image-kit-sys = { version = "0.3.6", optional = true, path = "components/multimedia/image_framework" }
ohos-media-library-sys = { version = "0.1.0", optional = true, path = "components/multimedia/media_library" }
ohos-media-sys = { version = "0.1.1", optional = true, path = "components/multimedia/player_framework" }
ohos-video-processing-engine-sys = { version = "0.1.0", optional = true, path = "components/multimedia/video_processing_engine" }
ohos-ime-sys = { version = "0.2.4", optional = true, path = "components/inputmethod" }
ohaudio-sys = { version = "0.1.0", optional = true, path = "components/ohaudio" }
ohos-ohaudiosuite-sys = { version = "0.1.0", optional = true, path = "components/ohaudiosuite" }
ohos-ohcamera-sys = { version = "0.1.0", optional = true, path = "components/ohcamera" }
arkweb-sys = { version = "0.1.1", optional = true, path = "components/web" }
ohos-ipckit-sys = { version = "0.1.1", optional = true, path = "components/ipckit" }
ohos-locationkit-sys = { version = "0.1.1", optional = true, path = "components/locationkit" }
ohos-netmanager-sys = { version = "0.1.1", optional = true, path = "components/netmanager" }
ohos-net-ssl-sys = { version = "0.1.1", optional = true, path = "components/net_ssl" }
ohos-netstack-sys = { version = "0.1.1", optional = true, path = "components/netstack" }
ohos-input-sys = { version = "0.3.4", optional = true, path = "components/multimodal-input" }
ohos-pasteboard-sys = { version = "0.1.5", optional = true, path = "components/pasteboard" }
ohos-libqos-sys = { version = "0.1.0", optional = true, path = "components/qos" }
ohos-rawfile-sys = { version = "0.1.4", optional = true, path = "components/rawfile" }
ohos-resourcemanager-sys = { version = "0.1.0", optional = true, path = "components/resourcemanager" }
ohos-rdb-sys = { version = "0.1.0", optional = true, path = "components/rdb" }
ohos-sensors-sys = { version = "0.1.1", optional = true, path = "components/sensors" }
ohos-dataprotectionkit-sys = { version = "0.1.0", optional = true, path = "components/DataProtectionKit" }
ohos-device-certificate-sys = { version = "0.1.0", optional = true, path = "components/device_certificate" }
ohos-telephony-sys = { version = "0.1.0", optional = true, path = "components/telephony" }
ohos-ffrt-sys = { version = "0.1.0", optional = true, path = "components/ffrt" }
ohos-connectivitykit-sys = { version = "0.1.0", optional = true, path = "components/ConnectivityKit" }
ohos-sys-opaque-types = { workspace = true }
ohos-filemanagement-sys = { version = "0.1.0", optional = true, path = "components/filemanagement" }
ohos-teekit-sys = { version = "0.1.0", optional = true, path = "components/teekit" }
ohos-window-sys = { version = "0.1.7", optional = true, path = "components/window" }
ohos-vsync-sys = { version = "0.1.6", optional = true, path = "components/vsync" }
udmf-sys = { version = "0.1.4", optional = true, path = "components/udmf" }
xcomponent-sys = { version = "0.3.6", optional = true, path = "components/xcomponent" }
ohos-window-manager-sys = { version = "0.1.4", optional = true, path = "components/window_manager" }


[features]
default = ["api-10"]
## Enables bindings to the AbilitKit. Re-exports the `ohos-abilitykit-sys` library.
abilitykit = ["dep:ohos-abilitykit-sys"]
## Enables bindings to the AbilityAccessControl (AccessToken) NDK. Re-exports `ohos-accesstoken-sys`.
accesstoken = ["dep:ohos-accesstoken-sys"]
## Enables bindings to the native ArkUI module. Re-exports the `arkui-sys` library.
arkui = ["dep:arkui-sys"]
## Enables bindings to the AssetStoreKit (Asset NDK). Re-exports `ohos-asset-store-sys`.
asset-store = ["dep:ohos-asset-store-sys"]
## Enables bindings to BasicServicesKit. Re-exports `ohos-basic-services-kit-sys`.
## Use the sub-API features (`basic-services-kit-commonevent`, …) to select
## individual NDKs within the kit.
basic-services-kit = ["dep:ohos-basic-services-kit-sys"]
## Enables bindings to the BackgroundProcessManager API. Re-exports `ohos-background-process-manager-sys`.
background-process-manager = ["dep:ohos-background-process-manager-sys"]
## Enables the CommonEvent NDK from BasicServicesKit.
basic-services-kit-commonevent = ["basic-services-kit", "ohos-basic-services-kit-sys?/commonevent"]
## Enables the BatteryInfo NDK from BasicServicesKit. Requires API-level 13.
basic-services-kit-battery-info = ["basic-services-kit", "ohos-basic-services-kit-sys?/battery-info"]
## Enables the Print NDK from BasicServicesKit.
basic-services-kit-print = ["basic-services-kit", "ohos-basic-services-kit-sys?/print"]
## Enables the Scan NDK from BasicServicesKit.
basic-services-kit-scan = ["basic-services-kit", "ohos-basic-services-kit-sys?/scan"]
## Enables the OS Account NDK from BasicServicesKit.
basic-services-kit-os-account = ["basic-services-kit", "ohos-basic-services-kit-sys?/os-account"]
## Enables the Time Service NDK from BasicServicesKit.
basic-services-kit-time-service = ["basic-services-kit", "ohos-basic-services-kit-sys?/time-service"]
## Enables bindings to the CryptoArchitectureKit. Re-exports `ohos-crypto-sys`.
crypto = ["dep:ohos-crypto-sys"]
## Enables bindings to the Universal Keystore Kit (HUKS). Re-exports `ohos-huks-sys`.
huks = ["dep:ohos-huks-sys"]
## Enables bindings to `deviceinfo.h`. Re-exports `ohos-deviceinfo-sys`
deviceinfo = ["dep:ohos-deviceinfo-sys"]
## Enables bindings to the DistributedHardware DeviceManager API. Re-exports `ohos-distributedhardware-sys`.
distributedhardware = ["dep:ohos-distributedhardware-sys"]
## Enables bindings to the Driver Development Kit API. Re-exports `ohos-ddk-sys`.
ddk = ["dep:ohos-ddk-sys"]
hid = ["dep:ohos-hid-sys"]
native-color-space-manager = ["dep:ohos-native-color-space-manager-sys"]
native-display-soloist = ["dep:ohos-native-display-soloist-sys"]
native-effect = ["dep:ohos-native-effect-sys"]
## Enables bindings to the NativeFence API. Re-exports `ohos-native-fence-sys`.
native-fence = ["dep:ohos-native-fence-sys"]
purgeable-memory = ["dep:ohos-purgeable-memory-sys"]
scsi-peripheral = ["dep:ohos-scsi-peripheral-sys"]
transient-task = ["dep:ohos-transient-task-sys"]
usb-serial = ["dep:ohos-usb-serial-sys"]
gamecontrollerkit = ["dep:ohos-gamecontrollerkit-sys"]
notificationkit = ["dep:ohos-notificationkit-sys"]
ark-runtime = ["dep:ohos-ark-runtime-sys"]
bundle = ["dep:ohos-bundle-sys"]
hiappevent = ["dep:ohos-hiappevent-sys"]
i18n = ["dep:ohos-i18n-sys"]
drm = ["dep:ohos-drm-sys"]
image-effect = ["dep:ohos-image-effect-sys"]
## Enables bindings to the MindSpore Lite NDK API. Re-exports `ohos-mindspore-sys`.
mindspore = ["dep:ohos-mindspore-sys"]
neural-network-runtime = ["dep:ohos-neural-network-runtime-sys"]
usb = ["dep:ohos-usb-sys"]
## Enables bindings to `native_drawing`. Re-exports `ohos-drawing-sys`.
drawing = ["dep:ohos-drawing-sys", "arkui-sys?/drawing"]
## Enables bindings to `hilog`
hilog = ["dep:hilog-sys"]
## Enables bindings to `hitrace`
hitrace = ["dep:hitrace-sys"]
## Enables bindings to the HiDebug debugging and profiling API. Re-exports `ohos-hidebug-sys`.
hidebug = ["dep:ohos-hidebug-sys"]
## Enables bindings to the HiCollie thread stuck and jank detection API. Re-exports `ohos-hicollie-sys`.
hicollie = ["dep:ohos-hicollie-sys"]
## Enables bindings to `inputmethod` from the IME-Kit. Empty if API-level < 12.
inputmethod = ["dep:ohos-ime-sys"]
## Enables bindings to the IPCKit framework.
ipckit = ["dep:ohos-ipckit-sys"]
## Enables bindings to the LocationKit framework.
locationkit = ["dep:ohos-locationkit-sys"]
## Enables bindings to the NetworkKit netmanager framework.
netmanager = ["dep:ohos-netmanager-sys"]
## Enables bindings to the NetworkKit net_ssl framework.
net_ssl = ["dep:ohos-net-ssl-sys"]
## Enables bindings to the NetworkKit netstack framework.
netstack = ["dep:ohos-netstack-sys"]
## Bindings to the [Image Kit](https://docs.openharmony.cn/pages/v5.0/en/application-dev/media/image/image-overview.md)
image-kit = ["dep:ohos-image-kit-sys"]
## Bindings to the AVSessionKit framework. Re-exports `ohos-av-session-sys`.
av-session = ["dep:ohos-av-session-sys"]
## Bindings to the MediaLibraryKit media library APIs. Re-exports `ohos-media-library-sys`.
media-library = ["dep:ohos-media-library-sys"]
## Bindings to the Media framework (Player / Recorder / Transcoder, AVCodec,
## demuxer / muxer, screen capture, low-power AV sinks). Re-exports `ohos-media-sys`.
media = ["dep:ohos-media-sys"]
## Bindings to the VideoProcessingEngine subsystem (GPU-accelerated colour space
## conversion, HDR metadata, scaling). Re-exports `ohos-video-processing-engine-sys`.
## Use `video-processing-engine-video-processing` / `video-processing-engine-image-processing`
## to select individual modules.
video-processing-engine = ["dep:ohos-video-processing-engine-sys"]
## Bindings to the Multimodal Input kit.
multimodal-input = ["dep:ohos-input-sys"]
## Enables bindings to the OHAudio module.
ohaudio = ["dep:ohaudio-sys"]
## Enables bindings to the OHAudioSuite module. Re-exports `ohos-ohaudiosuite-sys`.
ohaudiosuite = ["dep:ohos-ohaudiosuite-sys"]
## Enables bindings to the CameraKit ohcamera APIs. Re-exports `ohos-ohcamera-sys`.
ohcamera = ["dep:ohos-ohcamera-sys"]
## Enables bindings to the Web module.
web = ["dep:arkweb-sys"]
## Enables bindings to `napi`
napi = []
## Enables bindings to `native_buffer`
native_buffer = ['dep:ohos-window-sys']
## Enables bindings to `native_image`
native_image = ['dep:ohos-window-sys']
## Enables bindings to `native_window`
native_window = ['dep:ohos-window-sys']
## Enables to the ohos pasteboard (clipboard)
pasteboard = ['dep:ohos-pasteboard-sys']
## Enables bindings to the QoS thread scheduling APIs (and at api-20+ the Gewu
## on-device LLM inference APIs that share `libqos.so`).
qos = ['dep:ohos-libqos-sys']
## Enables bindings to `rawfile`
rawfile = ['ohos-rawfile-sys']
## Enables bindings to ResourceManager. Re-exports `ohos-resourcemanager-sys`.
resourcemanager = ['dep:ohos-resourcemanager-sys']
## Enables bindings to the relational database (RDB)
rdb = ["dep:ohos-rdb-sys"]
## Enables bindings to the sensors module.
sensors = ["dep:ohos-sensors-sys"]
## Enables bindings to the DataProtectionKit (DLP permission) API. Re-exports `ohos-dataprotectionkit-sys`.
dataprotectionkit = ["dep:ohos-dataprotectionkit-sys"]
## Enables bindings to the DeviceCertificateKit certificate manager API. Re-exports `ohos-device-certificate-sys`.
device-certificate = ["dep:ohos-device-certificate-sys"]
## Enables bindings to the TEEKit tee_client API. Re-exports `ohos-teekit-sys`.
teekit = ["dep:ohos-teekit-sys"]
## Enables bindings to the TelephonyKit (cellular data + radio) API. Re-exports `ohos-telephony-sys`.
telephony = ["dep:ohos-telephony-sys"]
## Enables bindings to the FFRT (Function Flow Runtime) API. Re-exports `ohos-ffrt-sys`.
ffrt = ["dep:ohos-ffrt-sys"]
## Enables bindings to the CoreFileKit (file management) API. Re-exports `ohos-filemanagement-sys`.
filemanagement = ["dep:ohos-filemanagement-sys"]
connectivitykit = ["dep:ohos-connectivitykit-sys"]
## Enables bindings to the Unified Data Management Framework (UDMF)
udmf = ['dep:udmf-sys']
## Enables bindings to `native_vsync`
vsync = ["dep:ohos-vsync-sys"]
## Enables bindings to `native_xcomponent`
xcomponent = ["dep:xcomponent-sys"]
## Enables bindings to `window_manager`
window_manager = ["dep:ohos-window-manager-sys"]

## Enables all components listed above. Orthogonal to `api-XX` features.
all-components = [
    "abilitykit",
